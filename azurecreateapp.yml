- name: Installer Docker et lancer le jeu 2048
  hosts: all
  become: true

  vars:
    game_image: "alexwhen/docker-2048"
    game_container_name: "game-2048"
    game_host_port: 8080
    game_container_port: 80

  tasks:
    - name: Installer Docker (paquets Ubuntu)
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker   # requis par community.docker
        state: present
        update_cache: true

    - name: Démarrer Docker et l'activer au boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Vérifier si le conteneur existe déjà
      ansible.builtin.command: docker inspect game-2048
      register: game_inspect
      changed_when: false
      failed_when: false

    - name: Lancer le conteneur 2048 (sans community.docker)
      ansible.builtin.command: >
        docker run -d --name game-2048 --restart unless-stopped
        -p 127.0.0.1:8080:80 aashiqq/2048-game
      when: game_inspect.rc != 0    

    - name: Vérifier que le jeu répond
      ansible.builtin.uri:
        url: "http://localhost:{{ game_host_port }}"
        status_code: 200
      register: game_check
      retries: 5
      delay: 5
      until: game_check.status == 200

    - name: Comment jouer
      ansible.builtin.debug:
        msg: >-
          ssh -L 8080:localhost:{{ game_host_port }}
          {{ ansible_user }}@{{ inventory_hostname }}
          puis http://localhost:8080

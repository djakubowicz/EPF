- name: Créer une VM Ubuntu sur Azure (Spain Central) avec IP publique et SSH
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - azure.azcollection

  vars:
    # --- Général ---
    resource_group_name: "myResourceGroup"
    location: "spaincentral"
    vm_name: "web-server-01"
    admin_username: "azureuser"
    # À fournir via un survey AAP (champ "password") ou un credential / Ansible Vault.
    # Ne pas le laisser en clair dans le playbook.
    admin_password: "{{ vm_admin_password }}"

    # --- Réseau ---
    vnet_name: "vnet-ansible-prod"
    vnet_prefix: "10.0.0.0/16"
    subnet_name: "subnet-web"
    subnet_prefix: "10.0.0.0/24"
    public_ip_name: "pip-{{ vm_name }}"
    nsg_name: "nsg-{{ vm_name }}"
    nic_name: "nic-{{ vm_name }}"

    # --- VM ---
    vm_size: "Standard_B2ats_v2"
    image_publisher: "Canonical"
    image_offer: "ubuntu-24_04-lts"
    image_sku: "server"
    image_version: "latest"

  tasks:
    - name: Groupe de ressources
      azure_rm_resourcegroup:
        name: "{{ resource_group_name }}"
        location: "{{ location }}"
        state: present

    - name: Réseau virtuel
      azure_rm_virtualnetwork:
        resource_group: "{{ resource_group_name }}"
        name: "{{ vnet_name }}"
        location: "{{ location }}"
        address_prefixes_cidr:
          - "{{ vnet_prefix }}"
        state: present

    - name: Sous-réseau
      azure_rm_subnet:
        resource_group: "{{ resource_group_name }}"
        virtual_network_name: "{{ vnet_name }}"
        name: "{{ subnet_name }}"
        address_prefix_cidr: "{{ subnet_prefix }}"
        state: present

    - name: Adresse IP publique (statique, Standard)
      azure_rm_publicipaddress:
        resource_group: "{{ resource_group_name }}"
        name: "{{ public_ip_name }}"
        location: "{{ location }}"
        allocation_method: static
        sku: standard
        version: ipv4
        state: present
      register: public_ip_output

    # Obligatoire avec une IP Standard : sans NSG autorisant le port 22,
    # tout le trafic entrant est bloqué.
    - name: Groupe de sécurité réseau (SSH autorisé)
      azure_rm_securitygroup:
        resource_group: "{{ resource_group_name }}"
        name: "{{ nsg_name }}"
        location: "{{ location }}"
        rules:
          - name: Allow-SSH
            protocol: Tcp
            destination_port_range: 22
            access: Allow
            priority: 1001
            direction: Inbound
            source_address_prefix: "*"   # idéalement : votre IP publique/32
        state: present

    - name: Carte réseau (NIC) avec IP publique et NSG
      azure_rm_networkinterface:
        resource_group: "{{ resource_group_name }}"
        name: "{{ nic_name }}"
        location: "{{ location }}"
        virtual_network: "{{ vnet_name }}"
        subnet_name: "{{ subnet_name }}"
        security_group: "{{ nsg_name }}"
        ip_configurations:
          - name: ipconfig1
            public_ip_address_name: "{{ public_ip_name }}"
            primary: true
        state: present

    - name: Machine virtuelle Ubuntu
      azure_rm_virtualmachine:
        resource_group: "{{ resource_group_name }}"
        name: "{{ vm_name }}"
        location: "{{ location }}"
        vm_size: "{{ vm_size }}"
        admin_username: "{{ admin_username }}"
        ssh_password_enabled: true
        network_interfaces: "{{ nic_name }}"
        managed_disk_type: Standard_LRS
        image:
          publisher: "{{ image_publisher }}"
          offer: "{{ image_offer }}"
          sku: "{{ image_sku }}"
          version: "{{ image_version }}"
        state: present
      register: vm_output

    - name: Attendre que SSH réponde
      ansible.builtin.wait_for:
        host: "{{ public_ip_output.state.ip_address }}"
        port: 22
        delay: 10
        timeout: 300
      when: public_ip_output.state.ip_address is defined

    - name: Afficher la commande de connexion
      ansible.builtin.debug:
        msg: "ssh {{ admin_username }}@{{ public_ip_output.state.ip_address }}"
